<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onward — help for life after a new disability</title>
<meta name="description" content="Find rehab hospitals, wheelchair clinics, specialists, benefits and community near you — and organize your next steps after a new disability.">
<meta name="theme-color" content="#0b4f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Onward">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Onward (beta)">
<meta property="og:description" content="A new road. You don't have to map it alone. Care, benefits, community and a step-by-step plan for life after a new disability.">
<meta property="og:image" content="https://mightywaters.github.io/onward/og-image.png">
<meta property="og:url" content="https://mightywaters.github.io/onward/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --ink:#1b1d1f; --muted:#4a5257; --line:#d6d0c4;
  --brand:#0b4f5c; --brand-ink:#ffffff; --brand-soft:#dcecee; --accent:#b4531b;
  --now:#b42318; --soon:#9a5b00; --later:#2f5d3a; --focus:#ffbf47;
  --radius:16px; --tap:60px; --gap:14px;
  font-size:112.5%;
}
html[data-size="l"]{font-size:131%}
html[data-size="xl"]{font-size:156%}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121518;--card:#1d2226;--ink:#f2f2ef;--muted:#b9c1c5;--line:#38424a;--brand:#5fc3cf;--brand-ink:#08262b;--brand-soft:#1f3a3f;--accent:#f0a46b;--now:#ff8a80;--soon:#ffc266;--later:#8fd19e}
}
html[data-theme="dark"]{--bg:#121518;--card:#1d2226;--ink:#f2f2ef;--muted:#b9c1c5;--line:#38424a;--brand:#5fc3cf;--brand-ink:#08262b;--brand-soft:#1f3a3f;--accent:#f0a46b;--now:#ff8a80;--soon:#ffc266;--later:#8fd19e}
html[data-contrast="high"]{--bg:#ffffff;--card:#ffffff;--ink:#000;--muted:#000;--line:#000;--brand:#00343c;--brand-ink:#fff;--brand-soft:#e6f3f4;--accent:#7a2e00;--now:#8a0000;--soon:#5c3700;--later:#123d1c}
html[data-contrast="high"][data-theme="dark"]{--bg:#000;--card:#000;--ink:#fff;--muted:#fff;--line:#fff;--brand:#7fe7f2;--brand-ink:#000;--brand-soft:#002a30;--accent:#ffc28f}
html[data-motion="reduce"] *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
a{color:var(--brand);text-underline-offset:3px}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.1rem}
p{margin:.25rem 0 .75rem}
.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:-999px;top:0;background:var(--brand);color:var(--brand-ink);padding:12px 16px;z-index:99}
.skip:focus{left:8px;top:8px}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 24px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-size:1.35rem;font-weight:700;min-height:48px}
.brand small{font-family:-apple-system,system-ui,sans-serif;font-size:.7rem;font-weight:600;color:var(--muted)}
.brand svg{width:34px;height:34px;flex:none}
.top .spacer{flex:1}
.btn,.chip,.tile,.row-btn{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:12px 20px;border-radius:var(--radius);border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;text-decoration:none;text-align:center}
.btn.secondary{background:transparent;color:var(--brand)}
.btn.small{min-height:52px;padding:8px 14px;font-size:.95rem}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5}
.iconbtn{min-width:52px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.2rem;display:inline-flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 var(--gap)}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.wrap{max-width:1040px}.grid.wide{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:120px;padding:16px;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);text-align:left;text-decoration:none;color:var(--ink);font-weight:700;font-size:1.02rem}
.tile .ico{font-size:1.8rem;line-height:1}
.tile:active,.row-btn:active,.btn:active,.chip:active{transform:scale(.98)}
.list{display:flex;flex-direction:column;gap:10px}
.row-btn{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);text-align:left;text-decoration:none;color:var(--ink)}
.row-btn .ico{font-size:1.6rem;width:2rem;text-align:center;flex:none}
.row-btn .txt{flex:1}
.row-btn .txt b{display:block;font-size:1.05rem}
.row-btn .txt span{display:block;color:var(--muted);font-size:.92rem}
.row-btn .chev{font-size:1.4rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;min-height:56px;padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:600;text-align:left}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip[aria-pressed="true"]::before{content:"✓ "}
.choice{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:14px 16px;border-radius:var(--radius);border:2px solid var(--line);background:var(--card);font:inherit;color:var(--ink);font-weight:600;text-align:left;cursor:pointer}
.choice .ico{font-size:1.6rem}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
input[type=text],input[type=tel],input[type=search],input[type=date],textarea,select{font:inherit;width:100%;min-height:var(--tap);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:110px}
label.field{display:block;font-weight:700;margin:0 0 6px}
.inputrow{display:flex;gap:10px;align-items:stretch}
.inputrow input{flex:1}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius);border:2px solid var(--now);background:color-mix(in srgb,var(--now) 8%,var(--card));margin-bottom:var(--gap)}
.banner .ico{font-size:1.4rem}
.banner a{font-weight:700}
.hero{padding:22px 0 8px}
.hero h1{font-size:2.3rem;font-weight:700}
.hero h1 small{font-family:-apple-system,system-ui,sans-serif;font-size:.9rem;color:var(--muted);font-weight:600;vertical-align:middle}
.tagline{font-size:1.45rem;line-height:1.3;margin:.5rem 0 1rem}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.85rem;font-weight:700;border:2px solid currentColor}
.p-now{color:var(--now)} .p-soon{color:var(--soon)} .p-later{color:var(--later)}
.step{display:flex;gap:12px;align-items:flex-start}
.check{flex:none;width:56px;height:56px;border-radius:14px;border:3px solid var(--brand);background:var(--card);font-size:1.6rem;color:var(--brand-ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.check[aria-checked="true"]{background:var(--brand)}
.step .body{flex:1}
.step.compact{padding:12px 14px;align-items:center}.step.compact .actions,.step.compact p{display:none}
.step.done .body b{text-decoration:line-through;color:var(--muted)}
.step .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.result h3{margin-bottom:2px}
.result .meta{color:var(--muted);font-size:.92rem;margin-bottom:8px}
.result .acts{display:flex;flex-wrap:wrap;gap:8px}
.dist{font-weight:800;color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--gap)}
.tabs .chip[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.progress{height:14px;border-radius:999px;background:var(--brand-soft);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--brand)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(5,1fr);max-width:860px}
nav.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;text-decoration:none;color:var(--muted);font-size:.8rem;font-weight:700}
nav.bottom a .ico{font-size:1.5rem}
nav.bottom a[aria-current="page"]{color:var(--brand);box-shadow:inset 0 4px 0 var(--brand)}
.back{margin:4px 0 12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--tap)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.foot{font-size:.85rem;color:var(--muted);margin-top:24px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw}
details summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700}
@media print{nav.bottom,header.top,.no-print,.actions,.acts{display:none!important}body{padding:0;background:#fff;color:#000}.card{break-inside:avoid;border-color:#999}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top no-print">
  <div class="wrap">
    <a class="brand serif" href="#/home" aria-label="Onward home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="var(--brand)"/><path d="M14 40 C 24 40, 28 24, 40 24" fill="none" stroke="var(--brand-ink)" stroke-width="5" stroke-linecap="round"/><path d="M34 16 L 46 24 L 36 34" fill="none" stroke="var(--brand-ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Onward <small>(beta)</small>
    </a>
    <span class="spacer"></span>
    <button class="iconbtn" id="sizeBtn" aria-label="Make text bigger or smaller" title="Text size">A<span style="font-size:.7em">A</span></button>
  </div>
</header>
<main id="main" class="wrap" tabindex="-1"></main>
<nav class="bottom no-print" aria-label="Main">
  <ul>
    <li><a href="#/home" data-nav="home"><span class="ico" aria-hidden="true">🏠</span>Home</a></li>
    <li><a href="#/care" data-nav="care"><span class="ico" aria-hidden="true">📍</span>Find care</a></li>
    <li><a href="#/resources" data-nav="resources"><span class="ico" aria-hidden="true">📚</span>Resources</a></li>
    <li><a href="#/plan" data-nav="plan"><span class="ico" aria-hidden="true">✅</span>My plan</a></li>
    <li><a href="#/settings" data-nav="settings"><span class="ico" aria-hidden="true">⚙️</span>Me</a></li>
  </ul>
</nav>
<div id="live" class="sr" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
